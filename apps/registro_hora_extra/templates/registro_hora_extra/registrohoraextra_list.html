{% extends 'base.html' %}

{% block main %}
<br>
    Banco de Horas
<br>
    {% for registro_re in object_list %}
        
        <a href="{% url 'update_hora_extra' registro_re.id %}">
            {{ registro_re }}
        </a>
        
        <a href="{% url 'delete_hora_extra' registro_re.id %}">
            Deletar
        </a>
        
        <br>
    {% endfor %}

    {% if not object_list %}
        <br>
        <h3>Não existem registros de hora extra no banco de dados.</h3>
    {% endif %}
<br>
    <a href="{% url 'create_hora_extra'%}" class="btn btn-outline-info">Novo</a>
    
{% endblock%}
